<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
    <script src="spatialInput.js" defer></script>
  </head>
  <body>
    <dialog id="intro-dialog">
      <p>Hi I'm going to make some sound</p>
      <button id="intro-dialog-close">ok</button>
    </dialog>
    <header>
      <h1>Audio Instrument</h1>
    </header>
    <main>
      <section>
        <div class="spatialInput">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100"
            class="xySVGEl"
          >
            <rect width="100" height="100" fill="transparent" id="xyPad" />
            <circle r="3" fill="red" cx="50" cy="50" class="xyPosMarker" />
          </svg>
        </div>
      </section>
      <div class="keyboard">
        <button class="key white-key" data-note="c4">C</button>
        <button class="key black-key" data-note="c#4">C#</button>

        <button class="key white-key" data-note="d4">D</button>
        <button class="key black-key" data-note="d#4">D#</button>

        <button class="key white-key" data-note="e4">E</button>

        <button class="key white-key" data-note="f4">F</button>
        <button class="key black-key" data-note="f#4">F#</button>

        <button class="key white-key" data-note="g4">G</button>
        <button class="key black-key" data-note="g#4">G#</button>

        <button class="key white-key" data-note="a4">A</button>
        <button class="key black-key" data-note="a#4">A#</button>

        <button class="key white-key" data-note="b4">B</button>
        <button class="key white-key" data-note="c5">C</button>
      </div>
    </main>
  </body>
</html>
